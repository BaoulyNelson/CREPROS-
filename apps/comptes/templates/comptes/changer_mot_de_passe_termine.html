{% extends 'base.html' %}

{% block contenu %}

        <h1>Mot de passe modifié</h1>
    </div>
</section>

<section class="py-5">

        <div class="carte p-4 p-md-5 text-center">

            </div>

            <a href="{% url 'comptes:profil' %}" class="btn btn-primary rounded-pill">
