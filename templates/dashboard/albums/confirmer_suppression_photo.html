{% extends 'dashboard/base_dashboard.html' %}
{% block dash_titre %}Supprimer une photo{% endblock %}
{% block dash_contenu %}
<div class="row">
  <div class="col-md-12">
    <div class="dash-card">
      <div class="dash-card-body text-center py-4">
        <i class="fas fa-image fa-3x text-danger mb-3"></i>
        <h5>Supprimer cette photo ?</h5>
        {% if object.image %}<img src="{{ object.image.url }}" alt="" style="max-height:150px" class="rounded my-3">{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3 mt-3">
            <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-2"></i>Supprimer</button>
            <a href="{% url 'galerie:dashboard_gerer_photos' object.album_id %}" class="btn btn-outline-secondary px-4">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
